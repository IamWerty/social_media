{% extends "base.html" %}

{% block content %}
  <div class="channels-container">
    <h1 class="channels-title">Channels</h1>
    <div class="channels-list">
      <ul>
        {% for channel in channels %}
          <li class="channel-item">
            <a href="{% url 'channel_detail' channel.id %}" class="channel-link">{{ channel.name }}</a>
          </li>
        {% endfor %}
      </ul>
    </div>
    <div class="create-channel">
      <a href="{% url 'channel_create' %}" class="create-channel-button">Create a new channel</a>
    </div>
  </div>
{% endblock %}
