{% extends "base.html" %}

{% block content %}
    <h1>Add a Comment to {{ book.title }}</h1>
    <form method="post" action="">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit Comment</button>
    </form>
    <a href="{{ book.get_absolute_url }}">Back to Book</a>
{% endblock %}
